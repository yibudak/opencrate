[workspace]
members = [
    "crates/opencrate-core",
    "crates/opencrate-aura",
    "crates/opencrate-fan",
    "crates/opencrate-power",
    "crates/opencrate-cli",
    "crates/opencrate-probe", "crates/opencrate-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/yibudak/opencrate"

# Internal crates share one version; update these requirements for each release.
[workspace.dependencies]
opencrate-core = { path = "crates/opencrate-core", version = "0.1.1" }
opencrate-aura = { path = "crates/opencrate-aura", version = "0.1.1" }
opencrate-fan = { path = "crates/opencrate-fan", version = "0.1.1" }
opencrate-power = { path = "crates/opencrate-power", version = "0.1.1" }

[profile.release]
strip = true

[profile.dev.package.egui_software_backend]
opt-level = 3
