[package]
name = "opencrate-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "opencrate-ui"
path = "src/main.rs"

[features]
# Opt-in, hardware-free native lifecycle and memory regression harness.
diagnostics = []

[dependencies]
opencrate-core = { workspace = true }
opencrate-aura = { workspace = true }
opencrate-fan = { workspace = true }
opencrate-power = { workspace = true }
egui = "0.33"
egui-winit = { version = "0.33", default-features = false, features = ["accesskit", "clipboard", "links", "wayland", "x11"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
softbuffer = "0.4"
winit = "0.30"
bytemuck = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
