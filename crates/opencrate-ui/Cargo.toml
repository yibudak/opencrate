[package]
name = "opencrate-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "opencrate-ui"
path = "src/main.rs"

[dependencies]
opencrate-core = { workspace = true }
opencrate-aura = { workspace = true }
opencrate-fan = { workspace = true }
opencrate-power = { workspace = true }
eframe = "0.32"
tray-icon = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
