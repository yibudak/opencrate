name: Set up Windows Rust
description: Install the GNU Rust toolchain and MinGW-w64 for Windows builds.
runs:
  using: composite
  steps:
    - name: Install MinGW-w64
      id: msys2
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-gcc
    - name: Install Rust components
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        Join-Path $env:MSYS2_LOCATION 'mingw64/bin' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
        rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component rustfmt --component clippy
        if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
    - name: Cache Cargo dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: windows-gnu
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
