name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || '' }}
  # Supersede old PR work, but let main and release checks finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  codeql:
    name: Security
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  windows:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check publishable source
        run: python scripts/check-privacy.py

      - name: Set up Rust and native tools
        uses: ./.github/actions/setup-windows-rust

      - name: Analyze PowerShell scripts
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $findings = @(Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings scripts/PSScriptAnalyzerSettings.psd1)
          $findings | Format-Table -AutoSize
          if ($findings.Count) { throw 'PowerShell analysis failed.' }

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $version = ($metadata.packages | Where-Object name -eq 'opencrate-ui').version
          if ($env:RELEASE_TAG -cne "v$version" -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Release tag must be v<major>.<minor>.<patch> matching Cargo.toml.'
          }

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run unit tests
        run: cargo test --locked --workspace

      - name: Check Clippy warnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check native UI lifecycle and resource budgets without hardware
        run: |
          python scripts/test-ui-runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'Visible UI lifecycle failed.' }
          python scripts/test-ui-runtime.py --start-hidden
          if ($LASTEXITCODE -ne 0) { throw 'Tray startup lifecycle failed.' }

      - name: Upload native UI measurements and captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-runtime-diagnostics
          path: target/ui-runtime-*/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

      - name: Build installer and check payload privacy
        run: ./scripts/build-installer.ps1 -BootstrapInnoSetup

      - name: Verify install, upgrade, languages and uninstall
        run: |
          $setups = @(Get-ChildItem dist/*-windows-x64-setup.exe)
          if ($setups.Count -ne 1) { throw 'Expected exactly one setup executable.' }
          ./scripts/test-installer.ps1 -InstallerPath $setups[0].FullName

      - name: Upload tested installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-setup
          path: |
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [windows, quality, codeql]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64-setup
          path: dist

      - name: Verify checksum and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/publish-release.py --tag "$RELEASE_TAG" --repo "$GH_REPO" --dist dist
