name: Repository quality

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  lint:
    name: Repository lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install verified actionlint binary
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' 'actionlint.tar.gz' | sha256sum --check
          mkdir -p actionlint-bin
          tar -xzf actionlint.tar.gz -C actionlint-bin actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Install lint tools
        run: |
          python -m pip install -r scripts/requirements-dev.txt
          npm ci --prefix .github/linters --ignore-scripts
      - name: Check workflow syntax and expressions
        run: actionlint
      - name: Check Python code and formatting
        run: |
          ruff check scripts
          ruff format --check scripts
      - name: Test privacy and release checks
        run: python -m unittest discover -s scripts/tests -v
      - name: Check documentation
        run: node .github/linters/node_modules/markdownlint-cli2/markdownlint-cli2-bin.mjs
      - name: Check publishable source
        run: python scripts/check-privacy.py

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Check advisories, licenses, dependency sources and version policy
        run: cargo deny --locked check

  coverage:
    name: Portable tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM coverage tools
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov@0.9.0
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: portable-coverage
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Test platform-independent control logic
        run: |
          mkdir -p target/coverage
          cargo llvm-cov --locked --no-default-features --lib \
            -p opencrate-core -p opencrate-aura -p opencrate-fan -p opencrate-power \
            --remap-path-prefix --lcov --output-path target/coverage/lcov.info
      - name: Write coverage summary
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-coverage
          path: target/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
