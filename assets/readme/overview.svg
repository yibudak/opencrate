<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Your lights. Your fans. Your choice.</title>
  <desc id="desc">OpenCrate brings colorful lighting effects, fan controls and Windows power settings together. These are feature illustrations, not screenshots. Hardware support varies.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#20232c"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffb324"/>
      <stop offset=".35" stop-color="#ff708c"/>
      <stop offset=".68" stop-color="#9c89ff"/>
      <stop offset="1" stop-color="#64dfd5"/>
    </linearGradient>
  </defs>
  <rect width="960" height="340" rx="20" fill="url(#background)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="32" y="49" fill="#f5f5f7" font-size="27" font-weight="700">Your lights. Your fans. Your choice.</text>
    <text x="32" y="78" fill="#b2b8c6" font-size="16">One app for the everyday adjustments.</text>
    <g fill="#242833" stroke="#373c49">
      <rect x="24" y="105" width="296" height="211" rx="14"/>
      <rect x="332" y="105" width="296" height="211" rx="14"/>
      <rect x="640" y="105" width="296" height="211" rx="14"/>
    </g>
    <!-- Lighting: a color wheel with a simple brightness slider. -->
    <circle cx="100" cy="169" r="34" fill="none" stroke="url(#rainbow)" stroke-width="12"/>
    <circle cx="100" cy="169" r="17" fill="#34303e"/>
    <g>
      <rect x="162" y="143" width="18" height="18" rx="9" fill="#ffb324"/>
      <rect x="189" y="143" width="18" height="18" rx="9" fill="#ff708c"/>
      <rect x="216" y="143" width="18" height="18" rx="9" fill="#9c89ff"/>
      <rect x="243" y="143" width="18" height="18" rx="9" fill="#64dfd5"/>
      <path d="M171 187h80" stroke="#434957" stroke-width="6" stroke-linecap="round"/>
      <path d="M171 187h52" stroke="#ffb324" stroke-width="6" stroke-linecap="round"/>
      <circle cx="223" cy="187" r="7" fill="#f5f5f7"/>
    </g>
    <text x="48" y="246" fill="#f5f5f7" font-size="24" font-weight="700">Set the mood</text>
    <text x="48" y="278" fill="#c5cbd6" font-size="18">17 lighting effects</text>
    <!-- Cooling: a fan symbol and low-to-high speed bars. -->
    <g transform="translate(410 169)" fill="#6bddd1">
      <path id="blade" d="M-4-12C-23-22-18-40-5-40C15-40 21-19 6-8Z"/>
      <use href="#blade" transform="rotate(120)"/>
      <use href="#blade" transform="rotate(240)"/>
      <circle r="10" fill="#242833" stroke="#6bddd1" stroke-width="3"/>
    </g>
    <g fill="#6bddd1">
      <rect x="478" y="177" width="15" height="22" rx="4" opacity=".45"/>
      <rect x="502" y="164" width="15" height="35" rx="4" opacity=".65"/>
      <rect x="526" y="151" width="15" height="48" rx="4" opacity=".85"/>
      <rect x="550" y="138" width="15" height="61" rx="4"/>
    </g>
    <text x="356" y="246" fill="#f5f5f7" font-size="24" font-weight="700">Find your balance</text>
    <text x="356" y="278" fill="#c5cbd6" font-size="18">Adjust fan speed</text>
    <!-- Power: a lightning bolt and a balanced setting. -->
    <path d="m725 128-26 44h23l-10 35 38-50h-26l13-29Z" fill="#ffb324"/>
    <g fill="none" stroke-linecap="round">
      <path d="M790 169h96" stroke="#444a57" stroke-width="8"/>
      <path d="M790 169h49" stroke="#ffb324" stroke-width="8"/>
      <circle cx="839" cy="169" r="12" fill="#242833" stroke="#ffb324" stroke-width="4"/>
    </g>
    <text x="664" y="246" fill="#f5f5f7" font-size="24" font-weight="700">Pick your power</text>
    <text x="664" y="278" fill="#c5cbd6" font-size="18">Switch Windows power plans</text>
  </g>
</svg>
